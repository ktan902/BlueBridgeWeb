<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TAO AU — Contact Form (Formspark Test)</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    background: #0E0E0E;
    margin: 0;
    padding: 60px 20px;
    display: flex;
    justify-content: center;
  }
  .card {
    background: #1A1A1A;
    border-radius: 14px;
    padding: 40px;
    max-width: 480px;
    width: 100%;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
  }
  h1 {
    font-size: 24px;
    color: #FFFFFF;
    margin: 0 0 6px;
  }
  p.subtitle {
    color: #9A9A9A;
    font-size: 14px;
    margin: 0 0 28px;
  }
  .row {
    display: flex;
    gap: 16px;
  }
  .row .field { flex: 1; }
  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: #D9D9D9;
    margin-bottom: 6px;
    margin-top: 18px;
  }
  input[type="text"],
  input[type="email"],
  textarea {
    width: 100%;
    padding: 12px 14px;
    background: #141414;
    border: 1px solid #3A3A3A;
    border-radius: 8px;
    font-size: 14px;
    font-family: inherit;
    color: #FFFFFF;
  }
  input::placeholder,
  textarea::placeholder {
    color: #6B6B6B;
  }
  textarea {
    resize: vertical;
    min-height: 110px;
  }
  input:focus,
  textarea:focus {
    outline: none;
    border-color: #F15A24;
  }
  .checkbox-row {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    margin-top: 20px;
  }
  .checkbox-row input[type="checkbox"] {
    margin-top: 3px;
    width: 16px;
    height: 16px;
    accent-color: #F15A24;
    flex-shrink: 0;
  }
  .checkbox-row label {
    margin: 0;
    font-size: 13px;
    font-weight: 400;
    color: #B3B3B3;
    line-height: 1.4;
  }
  .checkbox-row a {
    color: #F15A24;
    text-decoration: none;
  }
  button {
    margin-top: 26px;
    width: 100%;
    background: linear-gradient(90deg, #F15A24, #E63946);
    color: #FFFFFF;
    border: none;
    border-radius: 8px;
    padding: 14px;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.3px;
    cursor: pointer;
    text-transform: uppercase;
  }
  button:hover {
    opacity: 0.9;
  }
  .note {
    margin-top: 18px;
    font-size: 12px;
    color: #6B6B6B;
    text-align: center;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>Request The Marketing Machine</h1>
    <p class="subtitle">Test form — TAO AU Brochure / Formspark + Make pipeline</p>

    <form action="https://submit-form.com/vffBGxE1C" method="POST">
      <div class="row">
        <div class="field">
          <label for="firstname">First Name</label>
          <input type="text" id="firstname" name="firstname" placeholder="First Name" required>
        </div>
        <div class="field">
          <label for="lastname">Last Name</label>
          <input type="text" id="lastname" name="lastname" placeholder="Last Name" required>
        </div>
      </div>

      <label for="email">Email Address</label>
      <input type="email" id="email" name="email" placeholder="Email Address" required>
		
		 <label for="company">Company</label>
      <input type="text" id="company" name="company" placeholder="Company" required>

      <label for="jobtitle">Job Title</label>
      <input type="text" id="jobtitle" name="jobtitle" placeholder="Job Title" required>
		
		 <label for="phone">Phone</label>
      <input type="text" id="phone" name="phone" placeholder="Phone" required>

      

      <div class="checkbox-row">
        <input type="checkbox" id="terms" name="terms" required>
        <label for="terms">Send me TAO’s marketing insights and campaign updates.<br> 
(You can unsubscribe at anytime).
</label>
      </div>

      <!-- Optional: friendlier "from name" in Formspark notification emails -->
      <input type="hidden" name="_email.subject" value="New TAO AU Download Brochure Submission">

      <button type="submit">Submit</button>
    </form>

    <p class="note">Test deployment for validating Formspark → Make → Gmail. Not linked to production site.</p>
  </div>
</body>
</html>
